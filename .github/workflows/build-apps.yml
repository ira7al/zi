name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64,  target: win }
          - { os: ubuntu-latest,  label: linux-x64,    target: linux }
          - { os: macos-15,       label: macos-arm64,  target: mac }
          - { os: macos-15-intel, label: macos-x64,    target: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build (Windows/Linux)
        if: matrix.target != 'mac'
        run: pyinstaller --onefile --name ZiMusicStudio app/zi_app.py
      - name: Build (macOS .app)
        if: matrix.target == 'mac'
        run: pyinstaller --windowed --name "ZiMusicStudio" app/zi_app.py
      - name: Package artifact
        shell: bash
        run: |
          set -e
          mkdir -p out
          if [ "${{ matrix.target }}" = "win" ]; then
            (cd dist && 7z a -tzip -mx=9 ../out/ZiMusicStudio-${{ matrix.label }}.zip ZiMusicStudio.exe)
          elif [ "${{ matrix.target }}" = "mac" ]; then
            (cd dist && zip -9 -r ../out/ZiMusicStudio-${{ matrix.label }}.zip ZiMusicStudio.app)
          else
            (cd dist && tar czf ../out/ZiMusicStudio-${{ matrix.label }}.tar.gz ZiMusicStudio)
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ZiMusicStudio-${{ matrix.label }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ZiMusicStudio-*
          merge-multiple: true
      - name: Create release with all installers
        shell: bash
        run: |
          ls -la
          gh release create "${GITHUB_REF_NAME}" ZiMusicStudio-windows-x64.zip ZiMusicStudio-linux-x64.tar.gz ZiMusicStudio-macos-arm64.zip ZiMusicStudio-macos-x64.zip --title "Zi Music Studio ${GITHUB_REF_NAME}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
