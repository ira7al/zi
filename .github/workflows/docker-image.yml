name: Docker Image CI

on: workflow_dispatch  # was: on push/pull_request - manual only on dev-engine (starter scanner not configured for this repo)
permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
 
