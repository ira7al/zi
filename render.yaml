# Render Blueprint: dashboard.render.com -> New -> Blueprint -> pick this repo.
services:
  # FastAPI backend (Docker). A persistent disk requires a paid plan; without it jobs/releases vanish on redeploy.
  - type: web
    name: zi-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: zi-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false            # you enter this in the Render dashboard; never commit it
      - key: ADMIN_TOKEN
        generateValue: true    # Render generates a random value; copy it into the Studio's "Admin token" field
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://zi-site.onrender.com,https://YOUR-USERNAME.github.io
      - key: MUSIC_MODEL
        value: stability-ai/stable-audio-2.5
      - key: MODEL_LICENSE_COMMERCIAL
        value: "0"             # set to 1 only after you verify the model licence (see README)
      - key: BOT_ENABLED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12"

  # Static frontend (dashboard, Studio, Releases)
  - type: web
    name: zi-site
    runtime: static
    staticPublishPath: ./dist
    buildCommand: mkdir -p dist && cp *.html *.js *.css dist/   # publish only the frontend files, not backend source
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
